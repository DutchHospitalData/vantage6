name: Trivy Security Scan

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trivy:
    uses: dutchhospitaldata/ds-dev-sec-ops/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: "fs"
      severity: "CRITICAL,HIGH,MEDIUM"
      exit-code: "1"              # fail on findings
      upload-sarif: true
      scanners: "vuln,misconfig,secret"