services:

  vantage6-server:
    image: localhost:5000/infrastructure/server:local
    ports:
      - "7601:7601"
    depends_on:
      - database
    volumes:
      - ./configs/postgress.yaml:/mnt/config.yaml
    command: [
      "uwsgi",
      "--http", ":7601",
      "--gevent", "1000",
      "--http-websockets",
      "--http-chunked-input",
      "--http-keepalive",
      "--post-buffering", "0",
      "--master",
      "--callable", "app",
      "--disable-logging",
      "--wsgi-file", "/vantage6/vantage6-server/vantage6/server/wsgi.py",
      "--pyargv", "/mnt/config.yaml"
    ]

  ui:
    image: localhost:5000/infrastructure/ui:local
    ports:
      - "8000:80"
    environment:
      - SERVER_URL=http://localhost:7601
      - API_PATH=/api
    depends_on:
      - vantage6-server


  vantage6-node:
    image: localhost:5000/infrastructure/node:local
    volumes:
      # v6 node config yaml location
      - ./.config/vantage6/node/node.yaml:/mnt/config/node.yaml
      # Docker socket – the node needs this to launch algorithm containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Database files (matches databases[].uri in config template)
      - vantage6-node-data:/mnt/data
      # Persistent task directory (matches task_dir in config template)
      - /home/vantage-node/.local/share/vantage6/node/node:/mnt/data
    #secrets:
      # - azure_client_secret
      # - azure_client_id
      # - azure_tenant_id
      # - azure_blob_account_url
    command: [
      "vnode-local", "start",
      "-c", "/mnt/config/node.yaml",
      "-n", "node",
      "--dockerized"
    ]

  database:
    restart: always
    environment:
      POSTGRES_PASSWORD: changeme

  local-registry:
    image: registry:2
    container_name: local-registry
    ports:
      - "5000:5000"


secrets:
  azure_client_secret:
    file: ./.secrets/azure_client_secret.txt
  azure_client_id:
    file: ./.secrets/azure_client_id.txt
  azure_tenant_id:
    file: ./.secrets/azure_tenant_id.txt
  azure_blob_account_url:
    file: ./.secrets/azure_blob_account_url.txt

volumes:
  vantage6-node-data: