# Trivy secret scanning configuration
# This file configures the secret scanner to skip known test/development keys.
disable-allow-rules: []
enable-builtin-rules: []
disable-rules: []

allow-rules:
  - id: test-private-key
    description: "Test/development RSA key pair used for local dev and testing"
    path: "vantage6-node/vantage6/_data/private_key\\.pem"
